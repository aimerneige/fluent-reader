name: CI/CD Release Mac

on:
    release:
        types:
            - published

jobs:
    release-mac:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v2

            - name: Build and package the app
              run: |
                  npm install
                  npm run build
                  npm run package-mac

            - name: Get app version
              id: package-version
              uses: martinbeentjes/npm-get-version-action@master

            - name: Get release
              id: get_release
              uses: bruceadams/get-release@v1.2.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload dmg to release assets
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.get_release.outputs.upload_url }}
                  asset_path: "./bin/mac/x64/Fluent Reader-${{ steps.package-version.outputs.current-version }}.dmg"
                  asset_name: "Fluent.Reader.${{ steps.package-version.outputs.current-version }}.mac.dmg"
                  asset_content_type: application/octet-stream
